# Revisión semanal del curso (plan v3, sección 7): ejecuta TODO con las dependencias
# recién resueltas (requirements.txt solo fija mínimos) para detectar que una librería
# nueva rompe un notebook antes de que lo sufra un estudiante. También prueba los
# ejercicios del navegador con el Pyodide real y compila la web.
name: Curso (semanal)

on:
  schedule:
    - cron: "17 5 * * 1" # lunes 05:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notebooks:
    name: Todos los notebooks, dependencias sin caché
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      ANTHROPIC_API_KEY: ""
      MLFLOW_DISABLE_AGENT_HINT: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias (últimas versiones permitidas)
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install --upgrade -r requirements.txt
          pip list --format=freeze > versiones.txt

      - name: Ejecutar todos los notebooks
        run: python scripts/ejecutar_notebooks.py

      - name: Guardar versiones usadas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: versiones-python
          path: versiones.txt

  ejercicios:
    name: Ejercicios (Python local y Pyodide real)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install numpy pandas scipy scikit-learn pyyaml

      - run: python web/scripts/verificar_ejercicios.py

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Instalar la web
        working-directory: web
        run: npm ci

      # Descarga pandas, numpy y scikit-learn de cdn.jsdelivr.net: si cambian las versiones
      # de Pyodide, esto avisa de ejercicios que dejan de funcionar en el navegador.
      - name: Verificar con Pyodide
        working-directory: web
        run: npm run verificar:pyodide

  web:
    name: Compilar la web
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit
      - run: npm run build
